[project]
name = "f2atimer"
version = "0.1.0"
description = "Host software for the F2A optical lap timer"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
f2a-timer = "f2atimer.cli:main"
f2a-contest = "f2atimer.contest_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f2atimer"]
